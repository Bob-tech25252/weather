<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Noah Storm Scan Receiver</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

body {
    overflow: hidden;
}

/* HEADER */

.header {
    height: 70px;
    background: #151515;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    border-bottom: 2px solid #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.connection {
    display: flex;
    align-items: center;
    gap: 10px;
}

.dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: #00e676;
    box-shadow: 0 0 12px #00e676;
}

.dot.offline {
    background: #ff2222;
    box-shadow: 0 0 12px #ff2222;
}

/* MAIN */

.main {
    height: calc(100vh - 70px);

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

/* WAITING */

.waiting {
    text-align: center;
}

.waiting h1 {
    font-size: 45px;
    margin: 0 0 15px;
}

.waiting p {
    color: #aaa;
    font-size: 20px;
}

/* ALERT */

.alert {
    display: none;

    width: 90%;
    max-width: 1200px;

    background: #c00000;

    border: 8px solid white;

    padding: 45px;

    text-align: center;

    box-shadow:
        0 0 30px red,
        0 0 80px rgba(255,0,0,.7);

    animation: flash 1.2s infinite;
}

.alert.show {
    display: block;
}

@keyframes flash {

    0% {
        border-color: white;
    }

    50% {
        border-color: #ff0000;
    }

    100% {
        border-color: white;
    }

}

.alertTitle {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
}

.warningType {
    font-size: clamp(40px, 6vw, 80px);
    font-weight: 900;

    margin: 20px 0;
}

.location {
    font-size: clamp(28px, 4vw, 50px);
    font-weight: bold;

    margin-bottom: 25px;
}

.headline {
    font-size: 30px;
    font-weight: bold;

    margin-bottom: 20px;
}

.message {
    font-size: 23px;
    line-height: 1.5;

    max-width: 950px;
    margin: auto;
}

.id {
    margin-top: 30px;

    font-family: monospace;

    font-size: 18px;

    opacity: .8;
}

.times {
    margin-top: 20px;

    display: flex;
    justify-content: center;

    gap: 40px;

    font-size: 17px;
}

/* CONTROLS */

.controls {
    position: absolute;

    bottom: 20px;
    right: 20px;

    display: flex;
    gap: 8px;
}

button {
    padding: 10px 15px;

    background: #222;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;

    cursor: pointer;
}

button:hover {
    background: #444;
}

</style>
</head>

<body>

<header class="header">

    <div class="logo">
        NOAH STORM SCAN
    </div>

    <div class="connection">

        <div
            id="connectionDot"
            class="dot">
        </div>

        <span id="connectionText">
            Connecting...
        </span>

    </div>

</header>


<main class="main">

    <div
        id="waiting"
        class="waiting">

        <h1>🟢 RECEIVER READY</h1>

        <p>
            Monitoring Noah Storm Scan
        </p>

        <p id="status">
            Waiting for connection...
        </p>

    </div>


    <div
        id="alert"
        class="alert">

        <div class="alertTitle">
            ⚠ RED WARNING ⚠
        </div>

        <div
            id="warningType"
            class="warningType">
        </div>

        <div
            id="location"
            class="location">
        </div>

        <div
            id="headline"
            class="headline">
        </div>

        <div
            id="message"
            class="message">
        </div>

        <div
            id="id"
            class="id">
        </div>

        <div class="times">

            <div>
                ISSUED:
                <span id="issued"></span>
            </div>

            <div>
                EXPIRES:
                <span id="expires"></span>
            </div>

        </div>

    </div>


    <div class="controls">

        <button onclick="testAudio()">
            🔊 Test Audio
        </button>

        <button onclick="enableSpeech()">
            🗣 Enable Speech
        </button>

        <button onclick="fullscreen()">
            ⛶ Fullscreen
        </button>

    </div>

</main>


<audio
    id="alertAudio"
    src="alert-ready-tornado.mp3"
    preload="auto">
</audio>


<script>

/* =========================================
   CONFIG
========================================= */

const API_URL =
    "https://noah-storm-scan.base44.app/api/red-alerts";

const CHECK_INTERVAL = 5000;


/* =========================================
   STATE
========================================= */

let knownAlertIDs =
    JSON.parse(
        localStorage.getItem(
            "noahStormKnownAlertIDs"
        ) || "[]"
    );

let speechEnabled = false;


/* =========================================
   ELEMENTS
========================================= */

const waiting =
    document.getElementById("waiting");

const alertBox =
    document.getElementById("alert");

const warningType =
    document.getElementById("warningType");

const locationBox =
    document.getElementById("location");

const headline =
    document.getElementById("headline");

const message =
    document.getElementById("message");

const idBox =
    document.getElementById("id");

const issued =
    document.getElementById("issued");

const expires =
    document.getElementById("expires");

const status =
    document.getElementById("status");

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const audio =
    document.getElementById(
        "alertAudio"
    );


/* =========================================
   CHECK BASE44
========================================= */

async function checkForAlerts() {

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        connectionDot.className =
            "dot online";

        connectionText.textContent =
            "Connected";


        status.textContent =
            "Last checked: " +
            new Date()
                .toLocaleTimeString();


        processAlerts(data);


    } catch (error) {

        console.error(error);


        connectionDot.className =
            "dot offline";

        connectionText.textContent =
            "Offline";


        status.textContent =
            "Unable to connect to Noah Storm Scan";

    }

}


/* =========================================
   PROCESS ALERTS
========================================= */

function processAlerts(data) {

    const alerts =
        Array.isArray(data)
            ? data
            : data.alerts || [];


    const redAlerts =
        alerts.filter(
            alert =>
                String(
                    alert.alert_level
                ).toUpperCase()
                === "RED"
                &&
                alert.status === "active"
        );


    if (redAlerts.length === 0) {

        hideAlert();

        return;

    }


    redAlerts.sort(
        (a,b) =>
            new Date(
                b.issued_at
            ) -
            new Date(
                a.issued_at
            )
    );


    const currentAlert =
        redAlerts[0];


    /*
        THIS IS THE IMPORTANT PART.

        The ID tag determines whether
        the alert is new.
    */

    const alertID =
        currentAlert.alert_id;


    if (!alertID) {

        console.warn(
            "Alert has no alert_id."
        );

        return;

    }


    if (
        !knownAlertIDs.includes(
            alertID
        )
    ) {

        /*
            NEW ALERT
        */

        knownAlertIDs.push(
            alertID
        );


        /*
            Save IDs locally.
        */

        if (
            knownAlertIDs.length > 100
        ) {

            knownAlertIDs =
                knownAlertIDs.slice(
                    -100
                );

        }


        localStorage.setItem(
            "noahStormKnownAlertIDs",
            JSON.stringify(
                knownAlertIDs
            )
        );


        showAlert(
            currentAlert
        );


        playAudio();


        speak(
            currentAlert
        );

    }

    else {

        /*
            Existing alert.

            Update the display but
            DO NOT play audio again.
        */

        showAlert(
            currentAlert
        );

    }

}


/* =========================================
   DISPLAY
========================================= */

function showAlert(alert) {

    waiting.style.display =
        "none";

    alertBox.classList.add(
        "show"
    );


    warningType.textContent =
        alert.warning_type ||
        "RED WARNING";


    locationBox.textContent =
        alert.location ||
        "Unknown Location";


    headline.textContent =
        alert.headline ||
        "RED WARNING";


    message.textContent =
        alert.message ||
        "";


    idBox.textContent =
        "ALERT ID: " +
        alert.alert_id;


    issued.textContent =
        formatDate(
            alert.issued_at
        );


    expires.textContent =
        formatDate(
            alert.expires_at
        );

}


/* =========================================
   HIDE
========================================= */

function hideAlert() {

    alertBox.classList.remove(
        "show"
    );

    waiting.style.display =
        "block";

}


/* =========================================
   AUDIO
========================================= */

function playAudio() {

    audio.currentTime = 0;

    audio.play()
        .catch(error => {

            console.warn(
                "Browser blocked autoplay:",
                error
            );

        });

}


function testAudio() {

    audio.currentTime = 0;

    audio.play()
        .catch(() => {

            alert(
                "Click the page once, then try Test Audio again."
            );

        });

}


/* =========================================
   SPEECH
========================================= */

function enableSpeech() {

    speechEnabled = true;


    const test =
        new SpeechSynthesisUtterance(
            "Noah Storm Scan speech enabled."
        );


    speechSynthesis.speak(
        test
    );

}


function speak(alert) {

    if (!speechEnabled) {

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    speechSynthesis.cancel();


    const text =

        "Red warning. " +

        (
            alert.warning_type ||
            "Warning"
        ) +

        ". " +

        (
            alert.location ||
            "Unknown location"
        ) +

        ". " +

        (
            alert.message ||
            ""
        );


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.rate =
        0.9;

    speech.volume =
        1;


    speechSynthesis.speak(
        speech
    );

}


/* =========================================
   DATE
========================================= */

function formatDate(value) {

    if (!value) {

        return "--";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(
        "en-CA",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


/* =========================================
   FULLSCREEN
========================================= */

function fullscreen() {

    if (
        !document.fullscreenElement
    ) {

        document.documentElement
            .requestFullscreen();

    }

    else {

        document.exitFullscreen();

    }

}


/* =========================================
   START
========================================= */

checkForAlerts();


setInterval(
    checkForAlerts,
    CHECK_INTERVAL
);

</script>

</body>
</html>
